{% extends 'base.html' %}
{% load static %}

{% block title %}Catálogo de Productos{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'productos/css/productos.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
{% endblock %}

{% block content %}
<!-- Google Fonts y CSS Futurista -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

<div class="container futuristic-container py-5 fade-in-up">
    <div class="card futuristic-card mb-4">
        <div class="card-body d-flex flex-wrap gap-3 align-items-center justify-content-between">
            <div class="d-flex flex-wrap gap-3 align-items-center">
                <span class="fw-bold futuristic-label">Filtrar por:</span>
                <!-- Precio -->
                <div class="position-relative">
                    <select name="priceFilter" id="priceFilter"
                        class="form-select form-select-sm futuristic-input">
                        <option value="">Todos los precios</option>
                        <option value="asc" {% if request.GET.priceFilter == 'asc' %}selected{% endif %}>Menor a Mayor</option>
                        <option value="desc" {% if request.GET.priceFilter == 'desc' %}selected{% endif %}>Mayor a Menor</option>
                    </select>
                    <div class="filter-spinner spinner-border spinner-border-sm text-info d-none"></div>
                </div>
                
            </div>
        </div>
    </div>

    <!-- Spinner -->
    <div id="loadingSpinner" class="d-none text-center my-4">
        <div class="spinner-grow text-info" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="futuristic-label mt-2">Buscando productos...</p>
    </div>

    <!-- Productos -->
    <div >
        {% include 'productos/_product_grid.html' with productos=productos %}
    </div>
</div>



<!-- JS Visual FX -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const priceSelect = document.getElementById('priceFilter');
    const spinner = document.querySelector('.filter-spinner');

    priceSelect.addEventListener('change', () => {
        spinner.classList.remove('d-none');
        setTimeout(() => {
            const selected = priceSelect.value;
            const urlParams = new URLSearchParams(window.location.search);
            if (selected) urlParams.set('priceFilter', selected);
            else urlParams.delete('priceFilter');
            window.location.search = urlParams.toString();
        }, 600);
    });
});
document.addEventListener('DOMContentLoaded', function() {
    const priceFilter = document.getElementById('priceFilter');
    const categoriaLinks = document.querySelectorAll('.categoria-link');
    const productGrid = document.getElementById('productGrid');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const filterSpinner = document.querySelector('.filter-spinner');
    let debounceTimer;

    // Configurar Intersection Observer
    const observerOptions = {
        threshold: 0.1,
        rootMargin: "0px 0px -100px 0px"
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.style.opacity = "1";
                entry.target.style.transform = "translateY(0)";
            }
        });
    }, observerOptions);

    // Función para aplicar filtros
    const applyFilters = debounce(async () => {
        try {
            toggleLoading(true);
            const params = new URLSearchParams(window.location.search);
            params.set('priceFilter', priceFilter.value);
            
            loadingSpinner.classList.remove('d-none');
            
            const response = await fetch(`{% url 'productos:filtrar_productos' %}?${params.toString()}`);
            if (!response.ok) throw new Error('Error en la respuesta');
            
            const data = await response.json();
            productGrid.innerHTML = data.html;
            
            // Reiniciar observer para nuevas tarjetas
            productGrid.querySelectorAll('.card').forEach(card => {
                card.style.opacity = "0";
                card.style.transform = "translateY(20px)";
                observer.observe(card);
            });
            
            window.history.pushState({}, '', `?${params.toString()}`);
            showToast('Filtros aplicados correctamente', 'success');
            
        } catch (error) {
            console.error('Error:', error);
            showToast('Error al aplicar filtros', 'danger');
        } finally {
            toggleLoading(false);
            loadingSpinner.classList.add('d-none');
        }
    }, 300);

    // Helpers
    function toggleLoading(show) {
        filterSpinner.classList.toggle('d-none', !show);
        priceFilter.disabled = show;
    }

    function debounce(func, delay) {
        return (...args) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => func(...args), delay);
        };
    }

    function showToast(message, type) {
        // Implementar lógica de toast aquí
        console.log(`${type}: ${message}`);
    }

    // Event Listeners
    priceFilter.addEventListener('change', applyFilters);
    
    categoriaLinks.forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            const url = new URL(link.href);
            const params = new URLSearchParams(url.search);
            params.set('priceFilter', priceFilter.value);
            window.history.pushState({}, '', `?${params.toString()}`);
            applyFilters();
        });
    });

    // Inicializar observador
    productGrid.querySelectorAll('.card').forEach(card => {
        card.style.opacity = "0";
        card.style.transform = "translateY(20px)";
        card.style.transition = "all 0.4s ease";
        observer.observe(card);
    });
});
</script>
<script>
        document.addEventListener("DOMContentLoaded", function () {
            initCart();
            setupCartSync();
        });
</script>
{% endblock %}
