<div class="row">
  {% for producto in productos %}
    <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
      <div class="card h-100 producto-card animate-on-scroll border-0 rounded-4 shadow-neon d-flex flex-column">

        <!-- Imagen y categoría -->
        <div class="position-relative">
          <div class="ratio ratio-1x1 bg-dark-subtle">
            <img src="{{ producto.imagen.url }}" class="card-img-top object-fit-cover border-bottom border-primary-subtle" alt="{{ producto.nombre }}">
          </div>
          <span class="badge bg-glow position-absolute top-0 end-0 m-2 fs-6 px-3 py-2 rounded-pill">
            {{ producto.categoria.nombre }}
          </span>
          <a href="{% url 'productos:producto-detail' producto.pk %}"
             class="btn btn-sm btn-neon-outline position-absolute bottom-0 start-0 m-2">
            <i class="fas fa-info-circle me-1"></i> Detalles
          </a>
        </div>

        <!-- Cuerpo de la tarjeta -->
        <div class="card-body d-flex flex-column">
          <h5 class="card-title text-light fs-6 fw-semibold mb-2">{{ producto.nombre }}</h5>
          <p class="card-text fw-bold neon-price mb-3">Precio: $ {{ producto.precio|floatformat:0 }}</p>

          <!-- Formulario Agregar al carrito -->
          <form class="add-to-cart-form mt-auto d-flex align-items-center gap-2 flex-wrap" data-producto-id="{{ producto.id }}">
            {% csrf_token %}
            <div class="btn-group btn-group-sm" role="group">
              <button type="button" class="btn btn-outline-secondary" onclick="decrementQuantity('{{ producto.id }}')">
                <i class="fas fa-minus"></i>
              </button>
              <input type="number" name="cantidad" id="cantidad_{{ producto.id }}" value="1" min="1"
                     class="form-control form-control-sm text-center futuristic-input" style="width: 60px;">
              <button type="button" class="btn btn-outline-secondary" onclick="incrementQuantity('{{ producto.id }}')">
                <i class="fas fa-plus"></i>
              </button>
            </div>
            <button type="submit" class="btn btn-sm btn-neon">
              <i class="fas fa-cart-plus"></i> Agregar
            </button>
          </form>
        </div>

      </div>
    </div>
  {% endfor %}
</div>



<script>
// Control de cantidad
function incrementQuantity(productId) {
  const input = document.getElementById('cantidad_' + productId);
  input.value = parseInt(input.value) + 1;
}

function decrementQuantity(productId) {
  const input = document.getElementById('cantidad_' + productId);
  if (parseInt(input.value) > 1) {
    input.value = parseInt(input.value) - 1;
  }
}

// Mostrar mensajes simples (mejorable con toasts)
function showMessage(message) {
  alert(message);
}

// Manejo de formularios "Agregar al carrito"
document.addEventListener("DOMContentLoaded", () => {
  // Animaciones de entrada
  const cards = document.querySelectorAll(".animate-on-scroll");
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("show");
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });

  cards.forEach(card => {
    card.classList.add("fade-in-up");
    observer.observe(card);
  });

  // Carrito
  document.querySelectorAll('.add-to-cart-form').forEach(form => {
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const productoId = form.getAttribute('data-producto-id');
      const cantidad = form.querySelector('input[name="cantidad"]').value;
      const csrfToken = form.querySelector('[name=csrfmiddlewaretoken]').value;

      const url = "{% url 'cart:add' 0 %}".replace('0', productoId);

      fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'X-Requested-With': 'XMLHttpRequest'
        },
        credentials: 'same-origin',
        body: new URLSearchParams({
          'cantidad': cantidad,
          'csrfmiddlewaretoken': csrfToken
        })
      })
      .then(response => {
        if (!response.ok) throw new Error("Error en la respuesta del servidor");
        return response.json();
      })
      .then(data => {
        if (data.success) {
          const cartCountElem = document.getElementById('cartCount');
          if (cartCountElem) {
            cartCountElem.innerText = data.cart_count;
          }
          showMessage("Producto agregado al carrito");
        } else {
          showMessage("Error al agregar producto.");
        }
      })
      .catch(error => {
        console.error('Error:', error);
        showMessage("Error al procesar la solicitud.");
      });
    });
  });
});
</script>
