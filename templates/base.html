<!DOCTYPE html>
{% load static %}
<html lang="es" class="h-100">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tecno Enlace - Accesorios tecnológicos al mejor precio" />
  <title>{% block title %}Tecno Enlace{% endblock %}</title>
  {% block extra_css %}{% endblock %}

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />

  <!-- Favicon -->
  <link rel="icon" href="{% static 'images/favicon.png' %}" type="image/x-icon" />

  <!-- Bootstrap JS y dependencias -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS Personalizado -->
  <script src="{% static 'js/scripts.js' %}"></script>

  
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- NAVBAR -->
  {% include 'includes/navbar.html' %}

  <!-- Script base para URLs dinámicas -->
  <script>
    const baseDetailUrl = "{% url 'productos:producto-detail' 0 %}".replace('/0/', '/');
  </script>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-grow-1 py-4 py-md-5">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-dark text-light text-center py-3 mt-auto">
    {% include 'includes/footer.html' %}
  </footer>

  <!-- BOTÓN FLOTANTE CARRITO -->
  <a href="{% url 'cart:list' %}" class="btn btn-neon-float boton-flotante shadow-lg">
    <i class="fas fa-shopping-basket me-2"></i>
    <span class="texto-pedido">Hacer Pedido</span>
  </a>

  <!-- BOTÓN VOLVER ARRIBA -->
  <button class="btn btn-primary scroll-top shadow rounded-circle position-fixed end-3" style="z-index: 1050;" aria-label="Volver arriba">
    <i class="fas fa-chevron-up"></i>
  </button>

  <!-- BOTÓN FLOTANTE CHAT -->
  <button id="toggleChatBtn" class="btn btn-primary rounded-circle shadow position-fixed" style="bottom: 160px; right: 20px; z-index: 10000; width: 60px; height: 60px;">
    <i class="bi bi-chat-dots fs-4"></i>
  </button>

  <!-- CHAT FLOTANTE -->
  <div id="chatPopup" class="chat-popup">
    <div class="chat-header">
      <i class="bi bi-question-circle me-2"></i>Asistente IA
    </div>
    <div class="chat-body p-3">
      <form id="chatForm">
        {% csrf_token %}
        <div class="mb-3">
          <label for="pregunta" class="form-label small">Haz tu pregunta sobre nuestros productos:</label>
          <input type="text" name="pregunta" id="pregunta" class="form-control" placeholder="Ej: ¿Este producto es apto para gatos?" required />
        </div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-send">
            <i class="bi bi-send"></i> Preguntar
          </button>
        </div>
      </form>
      <div id="respuestaIA" class="alert alert-info mt-3 d-none">
        <strong><i class="bi bi-robot"></i> Respuesta:</strong>
        <p id="respuestaTexto" class="mb-0"></p>
      </div>
    </div>
  </div>



  <!-- TOASTS -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="{% static 'js/scripts.js' %}" defer></script>

</body>
</html>

<script> 
 document.addEventListener('DOMContentLoaded', function () {
      const toggleChatBtn = document.getElementById('toggleChatBtn');
      const chatPopup = document.getElementById('chatPopup');
      const chatForm = document.getElementById('chatForm');
      const respuestaIA = document.getElementById('respuestaIA');
      const respuestaTexto = document.getElementById('respuestaTexto');

      toggleChatBtn.addEventListener('click', () => {
        chatPopup.style.display = chatPopup.style.display === 'block' ? 'none' : 'block';
      });

      chatForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const formData = new FormData(chatForm);
        fetch("{% url 'ia:chat' %}", {
          method: "POST",
          headers: {
            'X-Requested-With': 'XMLHttpRequest',
            'X-CSRFToken': formData.get('csrfmiddlewaretoken'),
          },
          body: formData
        })
        .then(response => response.json())
        .then(data => {
          if (data.respuesta) {
            respuestaTexto.textContent = data.respuesta;
            respuestaIA.classList.remove('d-none');
          } else {
            respuestaTexto.textContent = "No se recibió respuesta.";
            respuestaIA.classList.remove('d-none');
          }
        })
        .catch(error => {
          console.error(error);
          respuestaTexto.textContent = "Ocurrió un error al procesar tu pregunta.";
          respuestaIA.classList.remove('d-none');
        });
      });
    });

</script>
