{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente IA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .chat-popup {
      position: fixed;
      bottom: 20px;
      right: 20px;
      max-width: 350px;
      width: 100%;
      background-color: #fff;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      z-index: 9999;
    }

    @media (max-width: 576px) {
      .chat-popup {
        right: 10px;
        left: 10px;
        bottom: 10px;
        max-width: none;
      }
    }

    .chat-header {
      background-color: #0d6efd;
      color: white;
      padding: 12px 16px;
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
      font-weight: bold;
    }

    .chat-body {
      padding: 16px;
    }

    .chat-footer {
      padding: 0 16px 16px;
    }

    .btn-send {
      background-color: #0d6efd;
      color: white;
    }
  </style>
</head>
<body>

<div class="chat-popup">
  <div class="chat-header">
    <i class="bi bi-question-circle me-2"></i>Asistente IA
  </div>
  <div class="chat-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="pregunta" class="form-label small">Haz tu pregunta sobre nuestros productos:</label>
        <input type="text" name="pregunta" id="pregunta" class="form-control" placeholder="Ej: ¿Este producto es apto para gatos?" required>
      </div>
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-send">
          <i class="bi bi-send"></i> Preguntar
        </button>
      </div>
    </form>
    {% if respuesta %}
      <div class="alert alert-info mt-3">
        <strong><i class="bi bi-robot"></i> Respuesta:</strong>
        <p class="mb-0">{{ respuesta }}</p>
      </div>
    {% endif %}
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
